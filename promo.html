<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      width: 440px;
      height: 280px;
      background: linear-gradient(135deg, #1A202C 0%, #2D3748 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: white;
      text-align: center;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 16px;
      background: #4299E1;
      width: 96px;
      height: 96px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    p {
      margin: 0;
      font-size: 16px;
      color: #A0AEC0;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="icon">⚡️</div>
  <h1>Tab Killer</h1>
  <p>Zen-like Tab Management</p>
</body>
</html>
