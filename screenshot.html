<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      width: 1280px;
      height: 800px;
      background: linear-gradient(135deg, #e2e8f0 0%, #edf2f7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    .presentation-container {
      display: flex;
      flex-direction: row;
      gap: 100px;
      align-items: center;
      background: white;
      padding: 60px 80px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    }

    .text-side {
      width: 480px;
      color: #2d3748;
    }

    .text-side h1 {
      font-size: 58px;
      margin: 0 0 20px 0;
      color: #1a202c;
      line-height: 1.1;
      letter-spacing: -1.5px;
    }

    .text-side p {
      font-size: 24px;
      color: #4a5568;
      line-height: 1.5;
      margin: 0 0 40px 0;
    }

    .feature-list {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 22px;
      color: #4a5568;
    }
    
    .feature-list li {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-weight: 500;
    }

    .check {
      background: #4299e1;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .browser-mockup {
      width: 320px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      border: 1px solid #e2e8f0;
      position: relative;
    }

    .browser-header {
      background: #f7fafc;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #e2e8f0;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot.red { background: #fc8181; }
    .dot.yellow { background: #f6e05e; }
    .dot.green { background: #68d391; }
    
    .url-bar {
      flex-grow: 1;
      background: #edf2f7;
      height: 24px;
      border-radius: 4px;
      margin-left: 12px;
      font-size: 12px;
      color: #a0aec0;
      display: flex;
      align-items: center;
      padding-left: 10px;
    }

    iframe {
      border: none;
      width: 320px;
      height: 600px;
      background: white;
      display: block;
    }
  </style>
</head>
<body>
  
  <div class="presentation-container">
    
    <div class="text-side">
      <h1>Zen-like Tab Management</h1>
      <p>Reclaim your computer's memory and stay focused on what matters.</p>
      
      <ul class="feature-list">
        <li><span class="check">✓</span> Auto-close inactive tabs</li>
        <li><span class="check">✓</span> 1-click site whitelisting</li>
        <li><span class="check">✓</span> Wildcard & domain rules</li>
        <li><span class="check">✓</span> Pause anytime</li>
      </ul>
    </div>

    <div class="browser-mockup">
      <div class="browser-header">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
        <div class="url-bar">github.com/TsarlinDomingo</div>
      </div>
      <iframe src="popup_mock.html" scrolling="no"></iframe>
    </div>
    
  </div>

</body>
</html>
